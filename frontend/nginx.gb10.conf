# command-deck nginx — GB10 host-network variant of frontend/nginx.conf.
#
# Identical to the frozen frontend/nginx.conf except:
#   - listen 5173 (the deck's documented port) because the container runs
#     with network_mode: host (compose port publishing is discarded there)
#   - proxy_pass targets 127.0.0.1 instead of the compose service names
#     `traffic-oracle` / `convoy-brain`, which no longer exist on any
#     bridge network — both services are host-networked on this box and
#     bridge-to-host-gateway traffic is firewall-dropped (observed as a
#     proxy timeout from both the compose bridge and docker0).
server {
    listen 5173;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy to traffic-oracle
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy to convoy-brain
    location /api/agent/ {
        rewrite ^/api/agent/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_connect_timeout 10s;
    }

    # Proxy MCP tool calls
    location /chat/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        chunked_transfer_encoding on;
    }
}
