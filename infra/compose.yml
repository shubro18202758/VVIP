# VVIP Convoy Orchestration Platform — Full Stack Compose
# Deployed on NVIDIA GB10 (Grace-Blackwell) 121.44 GiB unified memory.
#
# Model stack runs ON THE HOST (see infra/scripts/serve_models.sh):
#   :8083 model-host (pplx-decider-v1-27b)  :8084 llama-server (Gemma 4 12B)
#   :8085 embedding-service
# Containers reach them via host.docker.internal (extra_hosts below).
# Full memory budget: VVIP/models/MEMORY_BUDGET.md.

services:
  # ─── Storage Layer ───────────────────────────────────────────────
  postgis:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.postgis
    container_name: vvip-postgis
    environment:
      POSTGRES_DB: corridor_db
      POSTGRES_USER: corridor_admin
      POSTGRES_PASSWORD: ${POSTGIS_PASSWORD:-dev_changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ../services/corridor-store/migrations:/docker-entrypoint-initdb.d
      - ../services/corridor-store/config/postgresql.conf:/etc/postgresql/postgresql.conf
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corridor_admin -d corridor_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G

  valkey:
    image: valkey/valkey:8-alpine
    container_name: vvip-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    command: >
      valkey-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lfu
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 640M

  nats:
    image: nats:2-alpine
    container_name: vvip-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: -js -sd /data
    volumes:
      - nats_data:/data

  # ─── LLM Runtime ────────────────────────────────────────────────
  # Model hosts run OUTSIDE Docker for native GB10 unified-memory access.
  # Start them with: ./infra/scripts/serve_models.sh start
  #   :8083 model-host (27B decider)  :8084 llama-server (Gemma 4 12B)
  #   :8085 embedding-service (multivector + dense)
  # ollama :11434 is externally active and untouched; gemma-vvip:12b is an
  # optional debug side-load (models/Modelfile.gemma_vvip).

  # ─── Data Integration ───────────────────────────────────────────
  signal-ingress:
    build:
      context: ../services/signal-ingress
      dockerfile: ../../infra/docker/Dockerfile.signal-ingress
    container_name: vvip-signal-ingress
    environment:
      NATS_URL: nats://nats:4222
      RUST_LOG: info
    depends_on:
      nats:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── ML / Optimization ──────────────────────────────────────────
  traffic-oracle:
    build:
      context: ../services/traffic-oracle
      dockerfile: ../../infra/docker/Dockerfile.traffic-oracle
    container_name: vvip-traffic-oracle
    environment:
      VVIP_DATABASE_URL: postgresql://corridor_admin:${POSTGIS_PASSWORD:-dev_changeme}@postgis:5432/corridor_db
      VVIP_VALKEY_URL: redis://valkey:6379
      VVIP_NATS_URL: nats://nats:4222
      EMBEDDING_SERVICE_URL: http://host.docker.internal:8085
      # C7 gated city signal-plan writer — default OFF (empty = disabled).
      # scripts/showcase_run.sh exports =1 and recreates traffic-oracle so
      # the God's Eye Morning flagship can demonstrate band->plan shifts,
      # then restores every program it rewrote (POST /api/v1/signals/restore).
      VVIP_SIGNAL_POLICY_WRITER: ${VVIP_SIGNAL_POLICY_WRITER:-}
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgis:
        condition: service_healthy
      valkey:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G
        # NOTE: GPU access via NVIDIA Container Toolkit when needed
        # LLM/embedding inference is served by the host model stack on
        # :8083/:8084/:8085 via host.docker.internal (see serve_models.sh)

  # ─── Agentic Orchestration ──────────────────────────────────────
  convoy-brain:
    build:
      context: ../services/convoy-brain
      dockerfile: ../../infra/docker/Dockerfile.convoy-brain
    container_name: vvip-convoy-brain
    environment:
      VVIP_DATABASE_URL: postgresql://corridor_admin:${POSTGIS_PASSWORD:-dev_changeme}@postgis:5432/corridor_db
      VVIP_VALKEY_URL: redis://valkey:6379
      VVIP_NATS_URL: nats://nats:4222
      # Host model stack (models stream, C8/C10): fixed internal endpoints
      MODEL_HOST_URL: http://host.docker.internal:8083
      LLAMA_BASE_URL: http://host.docker.internal:8084
      EMBEDDING_SERVICE_URL: http://host.docker.internal:8085
      # legacy (retired with ollama_bridge.py; kept for transition):
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      TRAFFIC_ORACLE_URL: http://traffic-oracle:8081
      PORT: "8080"
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgis:
        condition: service_healthy
      valkey:
        condition: service_healthy
      traffic-oracle:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 2G

  # ─── Presentation ───────────────────────────────────────────────
  command-deck:
    build:
      context: ../frontend
      dockerfile: ../infra/docker/Dockerfile.frontend
    container_name: vvip-command-deck
    ports:
      - "5173:80"
    depends_on:
      convoy-brain:
        condition: service_started

volumes:
  postgis_data:
  valkey_data:
  nats_data:
