[project]
name = "event-emulator"
version = "0.1.0"
description = "Cause-tape event emulator for the VVIP corridor stack — injects only exogenous causes (procession schedules, marathon waves, weather onset, vehicle incidents, emergency green-corridor requests, convoy departures) through the real stack's real APIs"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    # HTTP server (:8090, CORS for the command-deck origin) + client
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",

    # Real-stack seams
    "psycopg[binary,pool]>=3.2",   # corridor-store (PostGIS) event rows + runs ledger (%s-bound);
                                   # binary = bundled libpq (python:3.12-slim ships none)
    "valkey>=6.0",                 # adaptive:inputs:{id} docs (engine_loop reader shape)
    "nats-py>=2.9",                # corridor.traffic.emulated showcase plane (Arrow IPC)
    "pyarrow>=18",                 # Arrow RecordBatch matching the live feed schema

    # Config / models / CLI
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "click>=8.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/event_emulator"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
