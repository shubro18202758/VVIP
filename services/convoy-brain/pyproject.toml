[project]
name = "convoy-brain"
version = "0.2.0"
description = "Two-tier agentic orchestration for VVIP convoy planning — pplx-decider strategic tier + Gemma 4 12B tactical tier"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    # Real-time state
    "valkey>=6.0",

    # Geospatial utilities
    "shapely>=2.0",
    "geojson>=3.1",

    # Data handling
    "pydantic>=2.10",
    "pydantic-settings>=2.6",

    # Structured logging
    "structlog>=24.4",

    # HTTP client for inter-service calls (llama-server, model-host, oracle)
    "httpx>=0.28",

    # Web server
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",

    # Observability
    "prometheus-client>=0.21",
    "psutil>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/convoy_brain"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
