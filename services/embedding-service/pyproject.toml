[project]
name = "embedding-service"
version = "1.0.0"
description = "Veer T1 MEMORY: pplx-embed-v2-late late-interaction memory with bge-m3 dense ANN recall"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "numpy>=2.1",
    "structlog>=24.4",
]

[project.optional-dependencies]
# Real encoders run inside the models venv (torch==2.14.0,
# sentence-transformers==6.1.0, transformers==5.17.0 — verified on this
# machine, see the model manifest). Kept optional so the service core and
# its tests install everywhere without CUDA wheels.
models = [
    "torch==2.14.0",
    "torchvision==0.29.0",
    "transformers==5.17.0",
    "sentence-transformers>=6.1.0",
    "accelerate>=1.15.0",
    "pillow>=12.3.0",
    "safetensors>=0.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embedding_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
